packages:
  - apps/*
  - packages/*
# Security fixes within the same major for deps the Sanity CLI pins exactly
# (via @vercel/frameworks). Drop each once `pnpm why` shows upstream moved past it.
overrides:
  '@vercel/frameworks>js-yaml': ^3.15.2
  '@vercel/frameworks>smol-toml': ^1.9.0
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.9.15 || 2.10.8'
  - '@turbo/darwin-arm64@2.9.15 || 2.10.8'
  - '@turbo/gen@2.9.15 || 2.10.8'
  - '@turbo/linux-64@2.9.15 || 2.10.8'
  - '@turbo/linux-arm64@2.9.15 || 2.10.8'
  - '@turbo/windows-64@2.9.15 || 2.10.8'
  - '@turbo/windows-arm64@2.9.15 || 2.10.8'
  - eslint-config-turbo@2.9.15 || 2.10.8
  - eslint-plugin-turbo@2.9.15 || 2.10.8
  - turbo@2.9.15 || 2.10.8
  - '@sveltejs/kit@2.65.2'
  - '@playwright/test@1.61.1'
  - '@sveltejs/load-config@0.2.0'
  - autoprefixer@10.5.1
  - playwright-core@1.61.1
  - playwright@1.61.1
  - svelte-check@4.7.1
  - svelte@5.56.4
  - vite@8.2.0
  - '@typescript-eslint/eslint-plugin@8.70.1 || 8.71.0 || 8.72.0'
  - '@typescript-eslint/parser@8.70.1 || 8.71.0 || 8.72.0'
  - '@typescript-eslint/project-service@8.70.1 || 8.71.0 || 8.72.0'
  - '@typescript-eslint/scope-manager@8.70.1 || 8.71.0 || 8.72.0'
  - '@typescript-eslint/tsconfig-utils@8.70.1 || 8.71.0 || 8.72.0'
  - '@typescript-eslint/type-utils@8.70.1 || 8.71.0 || 8.72.0'
  - '@typescript-eslint/types@8.70.1 || 8.71.0 || 8.72.0'
  - '@typescript-eslint/typescript-estree@8.70.1 || 8.71.0 || 8.72.0'
  - '@typescript-eslint/utils@8.70.1 || 8.71.0 || 8.72.0'
  - '@typescript-eslint/visitor-keys@8.70.1 || 8.71.0 || 8.72.0'
  - dotenv@18.0.2
  - typescript-eslint@8.70.1 || 8.71.0 || 8.72.0
  - '@sanity/access-ui@6.20.0'
  - '@sanity/code-input@7.3.13'
  - '@sanity/diff@6.20.0'
  - '@sanity/mutator@6.20.0'
  - '@sanity/schema@6.20.0'
  - '@sanity/types@6.20.0'
  - '@sanity/util@6.20.0'
  - '@sanity/validation@6.20.0'
  - '@sanity/vision@6.20.0'
  - sanity@6.20.0
  - '@sanity/client@8.10.0'
  - groq@6.20.0
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - core-js-pure
  - es5-ext
  - esbuild
